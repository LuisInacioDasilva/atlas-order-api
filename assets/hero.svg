<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Atlas Order API</title>
  <desc id="desc">Pedidos, auditoria e outbox transacional em um diagrama animado.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071325"/><stop offset="1" stop-color="#102d3d"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#33d5ff"/><stop offset="1" stop-color="#83ffbc"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#26506a" stroke-width=".5" opacity=".45"/></pattern>
    <style>
      .pulse{animation:pulse 2.8s ease-in-out infinite}.flow{animation:flow 3.6s linear infinite}.delay{animation-delay:-1.8s}
      @keyframes pulse{50%{opacity:.4}}@keyframes flow{to{transform:translateX(425px)}}
      @media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
    </style>
  </defs>
  <rect width="960" height="240" rx="18" fill="url(#bg)"/><rect width="960" height="240" rx="18" fill="url(#grid)"/>
  <rect x="22" y="18" width="916" height="204" rx="14" fill="none" stroke="#2b687b"/>
  <text x="48" y="55" fill="#88e7fc" font-family="monospace" font-size="12" letter-spacing="3">BACK-END / TRANSAÇÕES / RASTREABILIDADE</text>
  <text x="48" y="120" fill="#f4fbff" font-family="Arial,sans-serif" font-weight="800" font-size="43">ATLAS ORDER API</text>
  <text x="50" y="151" fill="#b4d0dc" font-family="Arial,sans-serif" font-size="16">O pedido muda. A trilha fica. O evento não se perde.</text>
  <g transform="translate(50 178)" font-family="monospace" font-size="11" fill="#8de6bd">
    <rect width="110" height="27" rx="6" fill="#123640" stroke="#2c8579"/><text x="15" y="18">LARAVEL 13</text>
    <rect x="119" width="112" height="27" rx="6" fill="#123640" stroke="#2c8579"/><text x="136" y="18">IDEMPOTÊNCIA</text>
    <rect x="240" width="102" height="27" rx="6" fill="#123640" stroke="#2c8579"/><text x="260" y="18">AUDITORIA</text>
  </g>
  <g transform="translate(555 44)" fill="none" stroke="#428da2" stroke-width="1.5">
    <rect width="112" height="48" rx="9"/><rect x="156" width="112" height="48" rx="9"/><rect x="312" width="62" height="48" rx="9"/>
    <path d="M112 24h44m112 0h44" stroke="url(#line)" stroke-dasharray="5 4"/>
    <path d="M212 48v44h132V48" stroke="#3b718b" stroke-dasharray="3 5"/>
  </g>
  <g fill="#d8f9ff" font-family="monospace" font-size="10" text-anchor="middle">
    <text x="611" y="73">ORDER</text><text x="767" y="73">EVENT</text><text x="898" y="73">ACK</text>
    <text x="777" y="154" fill="#8ee8bb">OUTBOX / AT-LEAST-ONCE</text>
  </g>
  <circle class="flow" cx="670" cy="68" r="4" fill="#84ffc2"/><circle class="flow delay" cx="670" cy="68" r="3" fill="#50d9ff"/>
  <circle class="pulse" cx="899" cy="68" r="7" fill="#62f0b3" opacity=".8"/>
</svg>
